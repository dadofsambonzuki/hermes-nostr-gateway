name: Test

# The project's gates, run on every push and pull request by an ngit-ci
# coordinator through act. This is the canonical repository, so the workflow
# lives under .ngit/act/workflows/; there is no GitHub mirror to keep in step.
#
# The install order is deliberate. requirements.txt is the only install path
# that carries the patched nostr-sdk wheel's URL and hash, so it goes first;
# `.[dev]` then sees 0.45.1 already satisfied instead of resolving the PyPI
# release of the same version, which would silently drop
# `nip44_v2_conversation_key` and fail Concord only at runtime. The assertion step
# turns that silent swap into a named CI failure.
#
# pytest and ruff are separate steps so a failure names its gate, and neither
# step needs a GITHUB_TOKEN.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both interpreters in the declared range: 3.12 is the floor `requires-python` names, so
      # a green run there is what proves the claim, and 3.13 is the range above it. A floor
      # CI never runs is how the 3.11 claim survived while the suite hung on 3.11 — see
      # docs/decisions.md, "Python 3.12 is the floor".
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the hash-pinned wheel, the package, and the dev tools
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check -r requirements.txt
          python -m pip install --no-cache-dir --disable-pip-version-check -e '.[dev]'

      - name: Force the pinned wheel into this interpreter
        run: |
          # pip treats a preinstalled 0.45.1 (from the runner image) as satisfying the
          # requirement, so the URL wheel never lands and the assertion below fails on a
          # tree that is actually correct. Reinstall it by URL, unambiguously.
          WHEEL="$(grep -oE 'https://[^ ]+\.whl' requirements.txt | head -1)"
          python -m pip install --no-cache-dir --disable-pip-version-check \
            --force-reinstall --no-deps "$WHEEL"

      - name: Assert the pinned nostr-sdk is the one installed
        run: |
          python - <<'PY'
          import nostr_sdk as sdk

          assert callable(getattr(sdk, "nip44_v2_conversation_key", None)), (
              f"wrong nostr_sdk at {sdk.__file__}: nip44_v2_conversation_key is missing; "
              "the pinned wheel is what provides it"
          )
          PY

      - name: Lint (ruff)
        run: ruff check src tests scripts benchmarks

      - name: Tests (pytest)
        run: python -m pytest -q
