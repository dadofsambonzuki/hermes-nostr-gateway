# Hermes Nostr Gateway — example configuration.
identity:
  # Path to a JSON file holding {"secret_key_hex": "..."} — never inline, never argv.
  secret_file: ~/.marmot-agents/hermes/accounts/hermes-agent/secret.json
  # Under systemd, prefer a credential over a file the service user can read itself:
  # LoadCredential=nostr_secret:/etc/hermes-nostr-gateway/identity.json in the unit puts
  # the key in $CREDENTIALS_DIRECTORY (readable only by the unit's user/group), out of
  # `systemctl show` and the environment.
  # Any of these three may be set; the order of precedence is as listed.
  # secret_credential: nostr_secret
  # secret_env: NOSTR_SECRET_KEY   # hand-run CLI only: an env var is the weakest of the three

relays:
  # Read set = our 10050 inbox relays PLUS the sender's app relays. Reading only the
  # first list misses DMs that exist nowhere else, silently (spec §3).
  # An entry is a URL, or {url, kinds} when that relay's filter must be narrower than
  # subscription when it appears in the same REQ — its wraps would go with it.
  read:
    - wss://relay.example.com/chat
    - wss://relay.example.com/inbox
    - wss://nos.lol
    - wss://relay.primal.net
    - wss://relay.ditto.pub
    - {url: wss://relay.dreamith.to, kinds: [1059]}
  # Read coverage beyond that list (spec §3). A peer who publishes only into their own
  # kind-10050 inbox relays is invisible to a fixed read list, silently. So the inbox
  # relays of every pubkey in `groups` are resolved at startup and on a refresh, then
  # added to the DM read set. `max_extra` is a hard cap on additions for the life of the
  # process; each addition is one DM subscription, never a feed/mention pair.
  peer_inbox:
    enabled: true            # the gate; on by default because coverage is correctness
    max_extra: 4             # hard cap, deduplicated against relays.read
    refresh_minutes: 60      # 0 = resolve once at startup
    # lookup: [wss://relay.example.com/chat, wss://nos.lol]   # default: first 4 of read+publish
  # Publish set is a floor; the recipient's 10050 relays are added per message.
  publish:
    - wss://relay.example.com/chat
    - wss://nos.lol
    - wss://relay.primal.net

# White Noise relays belong to the Marmot plane only (wn-agent), never the DM/feed
# read set: they reject public kinds and are not a general NIP-17 inbox.
whitenoise:
  - wss://relay.eu.whitenoise.chat
  - wss://relay.us.whitenoise.chat

store: ~/.local/state/hermes-nostr-gateway/gateway.db

# Writes leave the event loop: a message is queued (with its dedupe decided against the
# database, read-only) and committed in batches on a dedicated thread. See
# docs/store-writes.md for the measurements and the durability trade.
store_write:
  tick_ms: 20        # how long a row may sit queued: write latency AND kill -9 exposure
  batch_size: 512    # rows per transaction

# Media (spec §4b). An inbound attachment is recorded from its NIP-92 `imeta` tag but
# never fetched on receipt: the adapter asks for a blob with `media.get` when it is about
# to hand the message to the agent, and only then does the gateway download it, verify the
# sha256, sniff the type and cache it. The caps are enforced before the request (a declared
# size over the cap) and while reading the body (a server that omits or lies about
# Content-Length). `NOSTR_MEDIA=0` in the agent's environment stops the fetch at the adapter.
# The cache directory must be writable by the unit: this one is inside the sandbox's
# ReadWritePaths in the service unit.
media:
  enabled: true
  blossom_servers: [https://blossom.example.com]  # tried by sha256 if the message's url fails
  dir: ~/.local/state/hermes-nostr-gateway/media
  max_bytes: 26214400        # 25 MiB per blob
  max_files: 4               # attachments per message; later ones are refused
  max_cache_bytes: 536870912 # 512 MiB on disk, oldest blobs evicted first
  timeout: 20                # seconds per HTTP request

# Marmot: proxied to wn-agent, never reimplemented — MLS stays theirs (spec §16).
# ONE OWNER (docs/marmot-ownership.md): the gateway owns the wn-agent control socket and
# Hermes' own Marmot platform plugin is being retired. Both readers attached deliver every
# group message to the agent twice, so that combination is a startup error — `hng serve`
# refuses with the reason and exits 2. Until the flip the plugin is the carrier: leave
# `enabled: false` here and Hermes keeps carrying Marmot.
marmot:
  enabled: false                   # true = this gateway is the Marmot transport
  # Is Hermes' own Marmot platform plugin still on the same socket? `auto` reads
  # platforms.marmot.enabled out of Hermes' config (below), so the flag is not copied and
  # cannot drift; true/false pins it where there is no Hermes config to read (a container).
  # A missing file is "unknown", which never refuses a start.
  hermes_platform: auto
  # hermes_config: ~/.hermes/config.yaml   # default: $HERMES_HOME/config.yaml
  socket: ~/.marmot-agents/hermes/dev/wn-agent.sock
  home: ~/.marmot-agents/hermes     # account_id_hex is read from accounts/*/account.json
  # label: hermes-agent             # only needed when that home holds more than one account
  # group: fcc995ef9affe55608ff3fe9f917de51   # narrow the inbound subscription to one group

# Public feeds. Without rules, kind-1 events other than mentions are ignored.
feeds:
  - name: example-watch
    authors: []          # hex pubkeys to follow
    keywords: []         # case-insensitive substrings
    hashtags: []         # without the leading '#'

# Digest windows come from each policy rule's `reach: digest(15m)`; there is no
# global digest interval. See docs/digest-cursor.md.

# Replay on subscribe is for "crashed mid-delivery", not history: a reconnect or an
# adapter restart. The window is minutes and nothing older than the store's replay
# floor is offered (stamped when the store is created, or by `hng replay-skip` when an
# adapter handover means the backlog was already answered).
replay:
  limit: 20
  max_age_minutes: 120

# Outbound retry. A wrap that failed at one relay is republished from storage as the
# same signed event (never re-wrapped) in small batches. Age, not attempts, bounds the
# backlog: a row still failing after `ttl_hours` is marked `expired` and never tried
# again, so one dead relay cannot keep the queue churning for days. Expired rows stay
# in the table, and `hng status` reports wrap counts by status.
retry:
  ttl_hours: 24

# Drops (messages policy refused: not allowlisted, rate limited, or cut from a digest by
# its quota). They are stored as evidence and listed by the `drops` socket op / `hng
# drops`, with the reason and when. After `ttl_hours` a drop is still listed and still
# counted, but marked `expired` — the status line separates live refusals from history.
drops:
  ttl_hours: 168          # one week: long enough to see a spam wave, short enough to age

# Bot peers. A peer whose kind-0 metadata says `bot: true` is a program, and two agents
# answering each other have no natural stopping point — one bounce put 3,370 rows in the
# store for a sentence repeated in both directions. The flag is fetched once per peer
# (kind 0 is not in the read set) and cached in the store, so this costs one lookup per
# peer, not one per message. Humans are never subject to this block.
bots:
  enabled: true
  # Bot messages delivered to the agent per hour, per peer. Each delivery is a reply we
  # will make, so this bounds our replies; 0 means this gateway does not talk to bots.
  max_replies_per_hour: 6
  # Our own text coming back from that peer inside this window is an echo, not a message.
  echo_window: 15m
  # A bot can never reach the agent immediately; this is the digest window it gets instead.
  digest_interval: 15m

groups:
  family: []
  team: []
  peer: ["npub1examplepeernpub000000000000000000000000000000000000000000000"]

policies:
  - name: family-dms
    match: {group: family, kinds: [14, 1059], dm: true}
    reach: immediate
    authority: instructions
  - name: family-mentions
    match: {group: family, kinds: [1], mention: true}
    reach: immediate
    authority: instructions
  - name: peer-dms
    match: {group: peer, kinds: [14, 1059], dm: true}
    reach: immediate
    authority: instructions
  # Marmot application messages are inner kind 9; a group is not a DM, so match on kind.
  - name: family-marmot
    match: {group: family, kinds: [9]}
    reach: immediate
    authority: instructions
  - name: anyone-mentions
    match: {group: any, kinds: [1], mention: true}
    reach: digest(15m)
    authority: none
  - name: unknown-dms
    match: {group: unknown, kinds: [14, 1059], dm: true}
    reach: digest(1h)
    authority: none

defaults:
  reach: digest(15m)
  authority: none

# The control pane: where a confirmation is asked, and whose word needs none. One
# destination per plane; a plane with no entry is reported as unconfigured rather than
# guessed. `hng control` prints the resolved pane.
#
# control:
#   concord: concord:<community>:<channel>   # e.g. the #ops channel
#   nip17: npub1...                          # a DM peer that answers confirmations
#   marmot: <group id>                       # a White Noise group
#   trusted_npubs:                           # trusted in every plane
#     - npub1...
#   planes:
#     concord:
#       trusted_npubs:                       # trusted here as well, not instead
#         - npub1...
