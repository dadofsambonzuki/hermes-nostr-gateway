# Hermes Nostr Gateway — example configuration.
identity:
  # Path to a JSON file holding {"secret_key_hex": "..."} — never inline, never argv.
  secret_file: ~/.marmot-agents/hermes/accounts/hermes-agent/secret.json
  # Under systemd, prefer a credential over a file the service user can read itself:
  # LoadCredential=nostr_secret:/etc/hermes-nostr-gateway/identity.json in the daemon and
  # pass units puts the key in $CREDENTIALS_DIRECTORY (readable only by the unit's
  # user/group), out of `systemctl show` and the environment. A crontab pass has no
  # $CREDENTIALS_DIRECTORY, so a host using this form must schedule the pass as a systemd
  # timer (`deploy/hermes-nostr-gateway-ngit@.timer`).
  # Any of these three may be set; the order of precedence is as listed.
  # secret_credential: nostr_secret
  # secret_env: NOSTR_SECRET_KEY   # hand-run CLI only: an env var is the weakest of the three

# What this identity advertises to clients. Off by default: a deployment that does not want
# a slash menu should not publish one. Armada renders a bot's commands only from a
# replaceable kind-10304 manifest, discovered per conversation from members whose kind 0
# says `bot: true`; invocation is an ordinary `/name args` message either way. This is
# `advertise:`, not `profiles:` -- the latter is the profile-routing table further down.
# See docs/decisions.md, "The slash menu is the host's catalogue".
advertise:
  publish: false            # true = kind 0 + kind 10304; or a list, e.g. [commands]
  # name: example-agent     # required for the kind-0 half; `bot: true` is always set.
  #                         # Publishing it REPLACES this identity's kind 0 with `name`
  #                         # plus `fields`, so leave the kind-0 half off where another
  #                         # process (wn-agent) writes this identity's profile.
  # fields:                 # any extra kind-0 fields (about, picture, nip05, lud16, ...)
  #   about: A placeholder bot.
  # catalogue_file: ~/.local/state/hermes-nostr-gateway/commands.json
  #                         # default: commands.json beside the socket. The Hermes plugin
  #                         # writes it from the host's registry at startup.
  # relays: []              # extra relays; relays.publish plus our own 10002 writes are
  #                         # the default (a client reads the manifest over the room's
  #                         # relays, so a room relay outside the publish set belongs here).

relays:
  # Read set = our 10050 inbox relays PLUS the sender's app relays. Reading only the
  # first list misses DMs that exist nowhere else, silently (spec §3).
  # An entry is a URL, or {url, kinds} when that relay's filter must be narrower than
  # subscription when it appears in the same REQ — its wraps would go with it.
  read:
    - wss://relay.example.com/chat
    - wss://relay.example.com/inbox
    - wss://nos.lol
    - wss://relay.primal.net
    - wss://relay.ditto.pub
    - {url: wss://relay.dreamith.to, kinds: [1059]}
  # Read coverage beyond that list (spec §3). A peer who publishes only into their own
  # kind-10050 inbox relays is invisible to a fixed read list, silently. So the inbox
  # relays of every pubkey in `groups` are resolved at startup and on a refresh, then
  # added to the DM read set. `max_extra` is a hard cap on additions for the life of the
  # process; each addition is one DM subscription, never a feed/mention pair.
  peer_inbox:
    enabled: true            # the gate; on by default because coverage is correctness
    max_extra: 4             # hard cap, deduplicated against relays.read
    refresh_minutes: 60      # 0 = resolve once at startup
    # lookup: [wss://relay.example.com/chat, wss://nos.lol]   # default: first 4 of read+publish
  # Publish set is a floor; the recipient's 10050 relays are added per message.
  publish:
    - wss://relay.example.com/chat
    - wss://nos.lol
    - wss://relay.primal.net

# White Noise relays belong to the Marmot plane only (wn-agent), never the DM/feed
# read set: they reject public kinds and are not a general NIP-17 inbox.
whitenoise:
  - wss://relay.eu.whitenoise.chat
  - wss://relay.us.whitenoise.chat

store: ~/.local/state/hermes-nostr-gateway/gateway.db

# Writes leave the event loop: a message is queued (with its dedupe decided against the
# database, read-only) and committed in batches on a dedicated thread. See
# docs/store-writes.md for the measurements and the durability trade.
store_write:
  tick_ms: 20        # how long a row may sit queued: write latency AND kill -9 exposure
  batch_size: 512    # rows per transaction

# Media (spec §4b). An inbound attachment is recorded from its NIP-92 `imeta` tag but
# never fetched on receipt: the adapter asks for a blob with `media.get` when it is about
# to hand the message to the agent, and only then does the gateway download it, verify the
# sha256, sniff the type and cache it. The caps are enforced before the request (a declared
# size over the cap) and while reading the body (a server that omits or lies about
# Content-Length). `NOSTR_MEDIA=0` in the agent's environment stops the fetch at the adapter.
# The cache directory must be writable by the unit: this one is inside the sandbox's
# ReadWritePaths in the service unit.
media:
  enabled: true
  blossom_servers: [https://blossom.example.com]  # tried by sha256 if the message's url fails
  dir: ~/.local/state/hermes-nostr-gateway/media
  max_bytes: 26214400        # 25 MiB per blob
  max_files: 4               # attachments per message; later ones are refused
  max_cache_bytes: 536870912 # 512 MiB on disk, oldest blobs evicted first
  timeout: 20                # seconds per HTTP request

# Marmot: proxied to wn-agent, never reimplemented — MLS stays theirs (spec §16).
# ONE OWNER (docs/marmot-ownership.md): the gateway owns the wn-agent control socket and
# Hermes' own Marmot platform plugin is being retired. Both readers attached deliver every
# group message to the agent twice, so that combination is a startup error — `hng serve`
# refuses with the reason and exits 2. Until the flip the plugin is the carrier: leave
# `enabled: false` here and Hermes keeps carrying Marmot.
marmot:
  enabled: false                   # true = this gateway is the Marmot transport
  # Is Hermes' own Marmot platform plugin still on the same socket? `auto` reads
  # platforms.marmot.enabled out of Hermes' config (below), so the flag is not copied and
  # cannot drift; true/false pins it where there is no Hermes config to read (a container).
  # A missing file is "unknown", which never refuses a start.
  hermes_platform: auto
  # hermes_config: ~/.hermes/config.yaml   # default: $HERMES_HOME/config.yaml
  socket: ~/.marmot-agents/hermes/dev/wn-agent.sock
  home: ~/.marmot-agents/hermes     # account_id_hex is read from accounts/*/account.json
  # account_id_hex: <hex>          # fallback only, for a home with no account file yet.
  #                                # wn-agent's file is read first, and a configured id
  #                                # that contradicts it refuses the plane.
  # label: hermes-agent             # only needed when that home holds more than one account
  # group: fcc995ef9affe55608ff3fe9f917de51   # narrow the inbound subscription to one group

# Public feeds. Without rules, kind-1 events other than mentions are ignored.
feeds:
  - name: example-watch
    authors: []          # hex pubkeys to follow
    keywords: []         # case-insensitive substrings
    hashtags: []         # without the leading '#'

# Digest windows come from each policy rule's `reach: digest(15m)`; there is no
# global digest interval. See docs/digest-cursor.md.

# Replay on subscribe is for "crashed mid-delivery", not history: a reconnect or an
# adapter restart. The window is minutes and nothing older than the store's replay
# floor is offered (stamped when the store is created, or by `hng replay-skip` when an
# adapter handover means the backlog was already answered).
replay:
  limit: 20
  max_age_minutes: 120

# Outbound retry. A wrap that failed at one relay is republished from storage as the
# same signed event (never re-wrapped) in small batches. Age, not attempts, bounds the
# backlog: a row still failing after `ttl_hours` is marked `expired` and never tried
# again, so one dead relay cannot keep the queue churning for days. Expired rows stay
# in the table, and `hng status` reports wrap counts by status.
retry:
  ttl_hours: 24

# Drops (messages policy refused: not allowlisted, rate limited, or cut from a digest by
# its quota). They are stored as evidence and listed by the `drops` socket op / `hng
# drops`, with the reason and when. After `ttl_hours` a drop is still listed and still
# counted, but marked `expired` — the status line separates live refusals from history.
drops:
  ttl_hours: 168          # one week: long enough to see a spam wave, short enough to age

# Bot peers. A peer whose kind-0 metadata says `bot: true` is a program, and two agents
# answering each other have no natural stopping point — one bounce put 3,370 rows in the
# store for a sentence repeated in both directions. The flag is fetched once per peer
# (kind 0 is not in the read set) and cached in the store, so this costs one lookup per
# peer, not one per message. Humans are never subject to this block.
bots:
  enabled: true
  # Bot messages delivered to the agent per hour, per peer. Each delivery is a reply we
  # will make, so this bounds our replies; 0 means this gateway does not talk to bots.
  max_replies_per_hour: 6
  # Our own text coming back from that peer inside this window is an echo, not a message.
  echo_window: 15m
  # A bot can never reach the agent immediately; this is the digest window it gets instead.
  digest_interval: 15m

groups:
  family: []
  team: []
  peer: ["npub1examplepeernpub000000000000000000000000000000000000000000000"]

policies:
  # First, because rules are ordered and first match wins: `group: any` below matches a
  # stranger too, so the refusal has to stand above it. Unauthorised senders are refused
  # here whatever plane they arrive on: a NIP-17 DM (kind 14 or 1059), a kind-1 mention, a
  # legacy kind-4 note, a Marmot or Concord kind 9. To let one person in, put them in a
  # group and let a rule below name that group; never weaken this rule. Being named is not
  # enough on its own — a rule has to match the plane and kind too, and anything no
  # wildcard rule matches falls to `defaults`, which is `drop` as well.
  - name: strangers
    match: {group: unknown}
    reach: drop
    authority: none
  - name: family-dms
    match: {group: family, kinds: [14, 1059], dm: true}
    reach: immediate
    authority: instructions
  - name: family-mentions
    match: {group: family, kinds: [1], mention: true}
    reach: immediate
    authority: instructions
  - name: peer-dms
    match: {group: peer, kinds: [14, 1059], dm: true}
    reach: immediate
    authority: instructions
  # Marmot application messages are inner kind 9; a group is not a DM, so match on kind.
  - name: family-marmot
    match: {group: family, kinds: [9]}
    reach: immediate
    authority: instructions
  # A mention from somebody already in a named group. `group: any` is safe only because
  # `strangers` above has already refused everyone else: this rule can digest a colleague,
  # never a stranger.
  - name: members-mentions
    match: {group: any, kinds: [1], mention: true}
    reach: digest(15m)
    authority: none

defaults:
  # The rule that matches nothing, and the built-in reach when this block is missing: a
  # sender no rule covers is refused rather than digested, on every plane, so a fresh
  # install digests no stranger on any of them. Refused is not silent, though: the row is
  # kept as evidence, a `blocked` frame carries `reason: not_allowlisted` to the adapter,
  # and `hng drops` lists the message (with its `why`) for `drops.ttl_hours` (168h above).
  # The agent is shown the refusal, never the text. Legacy kind-4 DMs in particular cost a
  # sender nothing, so digesting them just feeds the noise.
  reach: drop
  authority: none

# Concord: the channel -> work mapping. A channel is a context, not a repository. `path` is
# the checkout, `project` is the Hermes project (worktree and branch anchoring, per profile)
# and `board` is the kanban queue the channel's work is filed on: three names, three jobs, none
# inferred from another. A checkout with no board is manual work; a board without a project is a
# config error, because nothing anchors the worktree. Nothing is created here -- `hng projects
# --check` reports what is missing, and startup only logs it.
#
# concord:
#   projects:
#     - channel: example-channel        # channel name, or its hex id
#       community: <community id>       # optional; restrict to one community
#       path: ~/Projects/example        # the checkout
#       project: example-project        # optional; Hermes project slug
#       board: example-channel          # optional; kanban board slug

# Who answers, and on what account (see docs/decisions.md, "A route travels on the frame").
# Ordinary turns run on whatever Hermes is configured with; a route lets one
# conversation ask for a specific provider, model and credential instead -- a cheap model for a
# noisy feed, a stronger one for a work channel, a dedicated key so one channel's usage is
# accountable. Precedence is channel > project > plane > default, and `hng route` prints
# which rule won.
#
# `key` is the NAME of an environment variable, never a value. The adapter asks Hermes's secret
# scope for it at the moment the turn runs, so the name has to be visible to the Hermes profile
# running the turn (its `$HERMES_HOME/.env` or process environment); `routing.env_file` is where
# the daemon itself checks it for `hng route`. A name that cannot be read fails the turn rather
# than falling back to another rule's credential. `routing.models` is the catalogue, so a
# typo is a load error instead of a turn on the wrong model. A block that cannot be loaded stops
# `hng serve` (like a Marmot ownership clash); `hng route --check` reports the same problems
# without starting anything.
#
# routing:
#   models:                            # required once routing is configured
#     - model-a
#     - model-b
#   default: {provider: provider-a, model: model-a, key: GATEWAY_MODEL_KEY}
#   planes:
#     concord: {provider: provider-a, model: model-b, key: CONCORD_MODEL_KEY}
#     nip17: {provider: provider-a, model: model-a}   # no key: the agent's own credential
#   channels:                          # Concord only: a channel id (or its current name)
#     - community: <community id>      # optional; restrict the rule to one community
#       channel: <channel id or name>
#       provider: provider-b
#       model: model-b
#       key: WORK_CHANNEL_KEY
#   projects:                          # Concord only: the Hermes project a channel declares
#     - project: example-project       # one rule covers every channel mapped to it
#       provider: provider-c
#       model: model-b
#       key: PROJECT_MODEL_KEY
#   # env_file: ~/.config/hermes-nostr-gateway/.env   # default: a .env beside this file
# The ngit bridge: the same channel mapping, used in both directions. Issues on the channel's
# repository become tasks on its board; PRs on that repository are announced in the channel.
# `hng ngit sync --channel <conversation>` resolves the repo and the board from concord.projects.
# An issue from a trusted npub (control.trusted_npubs, or the concord plane's own list) is
# queued ready and the channel gets one notice; any other author is held blocked and the
# channel is asked once, and `hng ngit answer <task> --yes|--no --by <npub>` decides it.
# See docs/ngit-bridge.md.
#
# ngit:
#   assignee: default            # profile a task created from an issue is dispatched to
#   reviews: true                # a PR also gets a review task on the board (never a merge)
#   review_assignee: review      # profile that review task is dispatched to; a bot role's own
#                                # identity + profile (see "Bot identities and profiles")
#   relays:                      # where 1618/1631 events are read; default: relays.read
#     - wss://relay.example
#   lookback_hours: 168          # the first poll's floor (0 = everything the relay gives)
#   sweep_hours: 24              # every pass re-reads applied/closed this far back, so a
#                                # status event that landed behind the cursor still heals
#                                # (0 turns the sweep off)
#   issues: true                 # import kind-1621 issues
#   prs: true                    # announce kind-1618 PRs and kind-1631 merges
#   priority: 0                  # task priority for anything the bridge creates
#   max_new: 20                  # new tasks per poll; the rest wait for the next one
#   max_prs: 10                  # notices decided on, and handed to the daemon, per poll
#   maintainers:                 # keys whose kind-1631/1632 status events are accepted;
#     - npub1...                 # the repository announcement's own maintainers are added
#                                # automatically, and an empty set accepts no merge
#   reviewers:                   # keys whose `Verdict:` comment can finish a review card,
#     - npub1...                 # and the only authors whose verdict is published as a
#                                # label. Empty + review_secret_file derives the review key;
#                                # otherwise no verdict is applied at all
#   review_secret_file: /etc/hermes-nostr-gateway/review.json
#                                # the review role's own key (nsec or hex), and the one that
#                                # signs the verdict it publishes: outside every checkout,
#                                # mode 0600, never in this file
#   verdicts: true               # read a verdict and finish a card by one, and publish the
#                                # review card's verdict on the PR as a kind-1111 comment
#                                # signed by the review role; false turns both off
#   labels: true                 # publish each PR's review state (review-required,
#                                # changes-requested, approved) as one NIP-34 label on the
#                                # PR; false publishes no extra events
#   ready_label: ready           # an issue is queued only when a trusted npub labels it "ready"
#   mentions: true               # an @mention in an issue/PR comment becomes a reply task
#   mention_assignee: default    # profile a mention reply task is dispatched to
#   reply_secret_file: /path/to/reply.json   # key a mention reply is signed with (default: identity.secret_file)
#   watch: true                  # the daemon wakes a pass when a mapped repo's issue/PR
#                                # event arrives; default on once `assignee` is set, and
#                                # `false` is exactly the cron-only behaviour (cron stays
#                                # as the floor either way -- see docs/ngit-bridge.md)
#   watch_debounce_s: 30         # coalesce a channel's events this long before the pass

# The Hermes plugin and this checkout: `integrations/hermes-plugin/adapter.py` is canonical, and
# Hermes loads a *copy* of it from its plugins directory -- so a merged adapter change reaches a
# running gateway only when that copy is refreshed and the process restarted. `hng doctor`
# compares the two by SHA-256 (the `adapter` check), `hng adapter status` prints both hashes and
# mtimes and warns when `hermes-gateway` started before the live copy was written, and
# `hng adapter install` backs the live copy up (`adapter.py.bak-<UTC stamp>`) and writes this
# build's file, leaving the restart to the operator. Default:
# `$HERMES_HOME/plugins/nostr/adapter.py`. `NOSTR_PLUGIN_PATH` in the environment wins over this
# setting, and `--live` wins over both; a value naming a directory gets `adapter.py` appended.
#
# adapter:
#   path: ~/.hermes/plugins/nostr/adapter.py

# The control pane: where a confirmation is asked, and whose word needs none. One
# destination per plane; a plane with no entry is reported as unconfigured rather than
# guessed. `hng control` prints the resolved pane.
#
# Concord invites use both halves: an invite from a trusted npub joins its Guestbook
# straight away, and anyone else's is held with the question posted into `control.concord`
# (see `hng concord`, and `hng concord <id>` to accept one by hand).
#
# control:
#   concord: concord:<community>:<channel>   # e.g. the #ops channel
#   nip17: npub1...                          # a DM peer that answers confirmations
#   marmot: <group id>                       # a White Noise group
#   trusted_npubs:                           # trusted in every plane
#     - npub1...
#   planes:
#     concord:
#       trusted_npubs:                       # trusted here as well, not instead
#         - npub1...

# Profiles: which Hermes profile a conversation's turn runs as. A profile is a whole
# instance -- its own config, sessions, skills and memory, under its own HERMES_HOME -- so a
# channel routed to `ops` runs with ops' history and memory while everything else stays the
# default profile. Hermes owns the runtime (`gateway.profile_routes` is its table for platform
# chats); this block is the route for *this* gateway's own conversations, which Hermes cannot
# key on: a plane, or a Concord channel by id or name.
#
# Precedence is channel > plane > default, and `default` is required with the block: every
# conversation resolves to exactly one rule (`hng route <conversation>` prints which, and
# what it beat). A route naming a profile Hermes does not have refuses the start rather than
# running the turn as the default profile (`hng profiles --check` reports the same).
#
# Two things Hermes requires and this gateway checks: `gateway.multiplex_profiles` must not be
# off in Hermes' config (a non-multiplexed gateway keeps the legacy agent:main namespace and
# ignores a routed profile), and the profile must not opt out with `gateway.standalone: true`.
# Creating a profile is `hermes profile create <name>` -- never this file, and never this
# gateway.
#
# profiles:
#   default: default                 # required with the block; routes to `default` are omitted
#   # root: ~/.hermes/profiles      # optional; default: profiles/ beside Hermes' config.yaml
#   planes:
#     marmot: work
#   channels:
#     - community: <community id>    # optional; restrict this rule to one community
#       channel: <channel id or name>
#       profile: ops

# Dependency proposals (`hng deps`): the weekly pipeline that scans these repositories,
# bumps what OSV reports at or above the CVSS floor, runs each repository's own gates and
# publishes what survives as a `pr/deps-<date>` proposal. It is deliberately not part of the
# daemon's poll loop: a run spends minutes in npm, cargo and docker, and must not be able to
# stall the relay. It runs as its own systemd oneshot -- `deploy/nostr-deps.service` on
# `deploy/nostr-deps.timer` -- and `hng deps run --dry-run` reports without writing.
deps:
  # One entry per repository a proposal may be made in. `owner` is whoever published the
  # NIP-34 announcement the `nostr://` remote resolves; `branch` is the branch a proposal is
  # cut from (NIP-34 carries no target branch).
  repositories:
    - name: example-repo
      owner: <owner npub>
      branch: main
  min_severity: 7            # CVSS floor: 7 = high and above
  workspace: /opt/deps-bot   # the bot's clones, kept across runs and never inside a checkout
  state_dir: /var/lib/nostr-deps    # last-proposal hashes, so a pending bump is not repeated
  log: /var/log/nostr-deps.log
  signer: <deps bot npub>    # signs the proposal push and the scan trigger; never a key file
  coordinator: <coordinator npub>   # whose name a manual CI run is requested from
  workflow: .ngit/act/workflows/dependencies.yml
  open_prs: true             # false = scan, bump and gate, publish nothing
  # The board a published proposal's review task is filed on, and the profile that runs it.
  # Empty is "no card": the proposal is still pushed, but nothing appears in the queue.
  board: ""
  review_assignee: default   # a review role of its own is the usual choice, as with `ngit`
