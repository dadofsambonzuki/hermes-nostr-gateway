[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-nostr-gateway"
version = "0.1.0"
description = "Nostr transport hub for Hermes agents: DMs, mentions, feeds, Concord, Marmot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # Patched build, not the PyPI release — see README, "The patched nostr-sdk wheel".
  # `nostr-sdk==0.45.1` would install the release wheel on a clean venv and leave the
  # Concord plane without nip44_conversation_key.
  "nostr-sdk @ https://github.com/dadofsambonzuki/nostr-sdk-ffi/releases/download/wheel-0.45.1-nip44/nostr_sdk-0.45.1-cp39-abi3-linux_x86_64.whl",
  "websockets>=12",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "structlog>=24.1",
]

[project.optional-dependencies]
media = ["httpx>=0.27", "puremagic>=1.24"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
hng = "hermes_nostr_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_nostr_gateway"]

# nostr-sdk is a direct URL (patched wheel); the package is not published to PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
